[build]
functions = "netlify/functions"

[build.environment]
# This is a public Kit custom-field name, not an authentication credential.
# Keep API keys and developer access credentials covered by Netlify's secrets scan.
SECRETS_SCAN_OMIT_KEYS = "KIT_PROFILE_FIELD_KEY"

# Functions are served at /.netlify/functions/<name> automatically.
# Do not add a catch-all-safe alias for them here — the /_redirects
# file's "/* /index.html 200" rule is processed before rules in this
# file and would swallow anything less specific than that exact path.

[[redirects]]
from = "/go/tt-rs"
to = "/?utm_source=tiktok&utm_medium=organic_social&utm_campaign=communication_pattern_profiles&utm_content=reassurance_seeker_20260928&content_series=communication_pattern_profiles&utm_term=hook_a&utm_experiment=reassurance_seeker_v1"
status = 302

[[redirects]]
from = "/go/ig-rs"
to = "/?utm_source=instagram&utm_medium=organic_social&utm_campaign=communication_pattern_profiles&utm_content=reassurance_seeker_20260928&content_series=communication_pattern_profiles&utm_term=hook_a&utm_experiment=reassurance_seeker_v1"
status = 302

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
